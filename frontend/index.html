<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Frota - Login</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="login-wrapper">
    <section class="card login-card">
      <h1>Controle de Frota</h1>
      <p style="color: var(--muted); margin-bottom: 1.25rem; font-size: 0.9rem;">
        Acesse com suas credenciais para gerenciar a frota.
      </p>

      <div id="login-alert" class="alert" role="alert"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="login">Login</label>
          <input type="text" id="login" name="login" required autocomplete="username" />
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" required autocomplete="current-password" />
        </div>

        <button type="submit" id="login-btn" style="width: 100%; margin-top: 0.5rem;">
          Entrar
        </button>
      </form>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
