<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Frota - Dashboard</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">Controle de Frota</div>
    <nav class="topbar-nav">
      <span id="user-info" style="font-size: 0.9rem; color: var(--muted);"></span>
      <a href="admin.html" id="admin-link" class="btn btn-secondary btn-sm hidden">Painel Admin</a>
      <button type="button" id="logout-btn" class="btn btn-danger btn-sm">Sair</button>
    </nav>
  </header>

  <main class="container">
    <div id="dashboard-alert" class="alert" role="alert"></div>

    <!-- Seção de Veículos -->
    <section class="card">
      <h2 id="veiculo-form-title">Gerenciar Veículos</h2>
      <form id="veiculo-form" class="grid-form">
        <input type="hidden" id="veiculo-id" />
        <div class="form-group">
          <label for="veiculo-marca">Marca</label>
          <input type="text" id="veiculo-marca" required placeholder="Ex: Fiat" />
        </div>
        <div class="form-group">
          <label for="veiculo-modelo">Modelo</label>
          <input type="text" id="veiculo-modelo" required placeholder="Ex: Cronos" />
        </div>
        <div class="form-group">
          <label for="veiculo-placa">Placa</label>
          <input type="text" id="veiculo-placa" required maxlength="8" placeholder="ABC1D23" />
        </div>
        <div class="form-group">
          <label for="veiculo-chassi">Chassi</label>
          <input type="text" id="veiculo-chassi" required placeholder="9BWZZZ377VT004251" />
        </div>
        <div class="form-group">
          <label for="veiculo-renavam">Renavam</label>
          <input type="text" id="veiculo-renavam" required placeholder="11 dígitos" />
        </div>
        <div class="form-group">
          <label for="veiculo-ano">Ano Modelo</label>
          <input type="number" id="veiculo-ano" required min="1900" max="2100" placeholder="2024" />
        </div>
        <div class="form-group">
          <label for="veiculo-responsavel">Motorista Responsável</label>
          <select id="veiculo-responsavel">
            <option value="">Sem responsável</option>
          </select>
        </div>
        <div class="form-group">
          <label for="veiculo-fipe">Código FIPE (opcional)</label>
          <input type="text" id="veiculo-fipe" placeholder="001004-9" />
        </div>
        <div class="form-group">
          <label for="veiculo-valor-venal">Valor Venal R$ (fallback FIPE)</label>
          <input type="number" step="0.01" min="0" id="veiculo-valor-venal" placeholder="55000.00" />
        </div>
        <div class="form-group">
          <label>Prévia IPVA (4% / Vencimento)</label>
          <input type="text" id="veiculo-previa-ipva" readonly placeholder="Informe placa e valor" />
        </div>
        <div class="actions">
          <button type="submit" id="veiculo-submit-btn">Salvar Veículo</button>
          <button type="button" id="veiculo-cancel-btn" class="btn-secondary hidden">Cancelar</button>
        </div>
      </form>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Placa</th>
              <th>Modelo</th>
              <th>Responsável</th>
              <th>Status</th>
              <th>Próximo IPVA (Data / Valor Est.)</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="veiculos-tbody"></tbody>
        </table>
      </div>
    </section>

    <!-- Seção de Motoristas -->
    <section class="card">
      <h2 id="motorista-form-title">Gerenciar Motoristas</h2>
      <form id="motorista-form" class="grid-form">
        <input type="hidden" id="motorista-id" />
        <div class="form-group">
          <label for="motorista-nome">Nome</label>
          <input type="text" id="motorista-nome" required placeholder="Nome completo" />
        </div>
        <div class="form-group">
          <label for="motorista-cpf">CPF</label>
          <input type="text" id="motorista-cpf" required placeholder="000.000.000-00" />
        </div>
        <div class="form-group">
          <label for="motorista-cnh">Nº CNH</label>
          <input type="text" id="motorista-cnh" required placeholder="11 dígitos" />
        </div>
        <div class="form-group">
          <label for="motorista-vencimento">Vencimento CNH</label>
          <input type="date" id="motorista-vencimento" required />
        </div>
        <div class="actions">
          <button type="submit" id="motorista-submit-btn">Salvar Motorista</button>
          <button type="button" id="motorista-cancel-btn" class="btn-secondary hidden">Cancelar</button>
        </div>
      </form>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>CPF</th>
              <th>CNH / Vencimento</th>
              <th>Veículos Sob Responsabilidade</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="motoristas-tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/motoristas.js"></script>
  <script src="js/veiculos.js"></script>
</body>
</html>
